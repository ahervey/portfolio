<title>Empty tin · Aaron Hervey</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // GitHub Pages serves this file for any missing address. Send visitors to the
  // site's own empty-tin page.
  (function () {
    // If the site is served from a project folder, list that folder name here.
    var projectFolders = ['portfolio', 'aj-portfolio'];
    var seg = location.pathname.split('/')[1];
    var onGithubIo = /\.github\.io$/.test(location.hostname);
    var base = onGithubIo && projectFolders.indexOf(seg) !== -1 ? '/' + seg + '/' : '/';
    location.replace(base + '#empty');
  })();
</script>
